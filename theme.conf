[General]

Background="Backgrounds/background-eyes.png"
## Path relative to the theme root. The default is Nazuna's eyes.

## Bundled backgrounds:
##   Backgrounds/background-eyes.png   — close-up of Nazuna's eyes (default)
##   Backgrounds/background-city.png   — night city, no characters
##   Backgrounds/background-yamori.png — Ko Yamori on the balcony
##   Backgrounds/background.png        — Nazuna by the vending machine
##   Backgrounds/background-manga.png  — high-contrast manga panel

DimBackgroundImage="0.12"
## Background dimming: 0.0 = none, 1.0 = fully black.

ScaleImageCropped="true"
## true = crop to fill the screen, false = fit the whole image.

ScreenWidth=""
ScreenHeight=""
## Empty = derive the size from the screen automatically.
## Set 1920/1080 to slightly speed up layout calculations.


## [Blur Settings]

FullBlur="false"
PartialBlur="true"
## true = blur the whole background; false + PartialBlur = blur the form area only.
## With FormPosition="left" the compact blur panel hugs the left screen edge
## and fades smoothly into the sharp background on the right.

BlurRadius="64"
## Blur strength. Values above 100 may slow down rendering.

BlurPanelWidth="0.88"
## Blurred panel width as a fraction of the form width (0.7–1.0).

BlurFadeWidth="6"
## Width of the soft fade on the right, in multiples of the font size.

FormPanelOpacity="0.62"
## Opacity of the dark form panel (0.0–1.0).


## [Design Customizations]

HaveFormBackground="true"
## Translucent panel behind the login form.

FormPosition="left"
## Form position: left, center or right.

BackgroundImageHAlignment="center"
BackgroundImageVAlignment="center"
## Background alignment: left/center/right and top/center/bottom.

MainColor="#e8e8e8"
## Main text and element color.

AccentColor="#cfcfcf"
## Hover, focus and pressed color.

BackgroundColor="#111111"
## Form panel, dropdown and screen padding color.

OverrideLoginButtonTextColor=""
## Force the login button text color (empty = automatic).

InterfaceShadowSize="5"
## Shadow size for dropdowns.

InterfaceShadowOpacity="0.55"
## Shadow opacity.

RoundCorners="3"
## Corner radius for fields and buttons. 0 = sharp corners.

ScreenPadding="0"
## BackgroundColor border around the screen (frame effect).

Font="Noto Sans"
## UI font. It must be available to the sddm user.

FontSize=""
## Fixed font size. Empty = automatic.

AnimationsEnabled="true"
## false = disable intro, crossfade, orbit rotation, shake and login fade.

ShowTitleCard="true"
## Small "CALL OF THE NIGHT" caption in the bottom-right corner.


## [Interface Behavior]

ForceRightToLeft="false"
## Mirror the interface layout.

ForceLastUser="true"
## Preselect the last logged-in user.

ForcePasswordFocus="true"
## Focus the password field automatically.

ForceHideCompletePassword="true"
## Never reveal typed password characters.

ForceHideVirtualKeyboardButton="true"
## Hide the virtual keyboard button.

ForceHideSystemButtons="false"
## Hide the power button.

AllowEmptyPassword="false"
## Allow logging in without a password.

AllowBadUsernames="false"
## Do not change the case of usernames.


## [Locale Settings]

Locale="ru_RU"
## Date and time locale. Empty = system locale.

HourFormat="HH:mm"
DateFormat="dddd, d MMMM"


## [Translations]

HeaderText="CALL OF THE NIGHT"
HeaderSubtext="よふかしのうた"
## Title and subtitle above the clock. HeaderText may be left empty.

