TranslatePlaceholderUsername="имя пользователя"
TranslatePlaceholderPassword="пароль"
TranslateShowPassword="Показать пароль"
## Label for the show-password checkmark under the field.
TranslateLogin="Войти"
TranslateLoginFailedWarning="Неверное имя пользователя или пароль"
TranslateSession="Сессия:"
TranslatePower="Питание"
TranslateSuspend="Сон"
TranslateHibernate="Гибернация"
TranslateReboot="Перезагрузка"
TranslateShutdown="Выключить"
